name: Build JustGram APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Prepare build environment
        run: |
          chmod +x gradlew
          if [ ! -f secrets_for_ci.env ]; then
            echo -e "TELEGRAM_CHAT_ID=-100\nTELEGRAM_BOT_TOKEN=\nTG_APP_ID=\nTG_APP_HASH=\nSYSTEM_USERNAME=runner" > secrets_for_ci.env
          fi
          if [ ! -f Your_Key.jks ]; then
            keytool -genkey -v -keystore Your_Key.jks -alias Your_Alias -keyalg RSA -keysize 2048 -validity 10000 -storepass Your_Password -keypass Your_Password -dname "CN=JustGram, OU=Dev, O=JustGram, L=Default, ST=Default, C=RU"
          fi

      - name: Build Standalone APK
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            --no-daemon \
            --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustGram-v0.1.0-beta.1-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
